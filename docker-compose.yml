x-app-env: &app-env
  # Inside the compose network, services reach Postgres/Redis by service
  # name, not localhost — override whatever .env has for local (non-Docker)
  # development. Shared via an anchor so web/worker/beat can't drift apart
  # on connection details.
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-backend_dbms}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CACHE_URL: redis://redis:6379/2
  CHANNELS_REDIS_URL: redis://redis:6379/3

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend_dbms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      # A named volume specifically for MEDIA_ROOT, layered on top of the
      # bind mount above at the same path: the image runs as a non-root
      # user (Dockerfile), and a bind-mounted host directory doesn't carry
      # the container's file ownership, so the app user can't write into
      # it — this bit us directly (a Celery export task's file.save()
      # failed with PermissionError until this was added). A named volume
      # is managed entirely by the Docker daemon and isn't subject to that
      # host/container UID mismatch. Source code still hot-reloads via the
      # bind mount; only this one runtime-writable subdirectory is exempt.
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
