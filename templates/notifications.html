{% extends "base.html" %}
{% load static %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-semibold">Notifications</h1>
  <button id="mark-all-btn" class="text-sm text-indigo-600 hover:underline">Mark all as read</button>
</div>
<ul id="notification-list" class="bg-white rounded shadow divide-y divide-gray-100 text-sm"></ul>
<p id="notification-empty" class="hidden text-gray-500 text-sm mt-2">No notifications yet.</p>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/pages/notifications.js' %}"></script>
{% endblock %}
