{% extends "base.html" %}
{% load static %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 bg-white p-6 rounded shadow">
  <h1 class="text-xl font-semibold mb-4">Create an account</h1>
  <form id="register-form" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1" for="username">Username</label>
      <input id="username" name="username" required autocomplete="username"
             class="w-full border border-gray-300 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email"
             class="w-full border border-gray-300 rounded px-3 py-2">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium mb-1" for="first_name">First name</label>
        <input id="first_name" name="first_name" class="w-full border border-gray-300 rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="last_name">Last name</label>
        <input id="last_name" name="last_name" class="w-full border border-gray-300 rounded px-3 py-2">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="new-password"
             class="w-full border border-gray-300 rounded px-3 py-2">
    </div>
    <p id="form-error" class="text-sm text-red-600 hidden"></p>
    <button type="submit" class="w-full bg-indigo-600 text-white rounded py-2 font-medium hover:bg-indigo-700">
      Register
    </button>
  </form>
  <p class="text-sm text-gray-600 mt-4">
    Already have an account? <a href="/login/" class="text-indigo-600 hover:underline">Log in</a>
  </p>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/pages/register.js' %}"></script>
{% endblock %}
